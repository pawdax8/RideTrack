name: Build RideTrack APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum dibuat"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ridetrack.p12"

      - name: Build RideTrack APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/ridetrack.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RideTrack-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Terbitkan rilis
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RideTrack.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RideTrack.apk --clobber
          else
            gh release create "$TAG" RideTrack.apk --target "$GITHUB_SHA" --title "RideTrack 1.0.${GITHUB_RUN_NUMBER}" --notes "Build otomatis"
          fi
